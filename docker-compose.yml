services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridiron
      POSTGRES_PASSWORD: gridiron
      POSTGRES_DB: gridiron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridiron -d gridiron"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://gridiron:gridiron@db:5432/gridiron
      MODEL_DIR: ml/artifacts
      DEFAULT_MODEL_VERSION: logreg_v1
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/ml/artifacts

  scheduler:
    build: ./backend
    restart: unless-stopped
    entrypoint: ["python", "-m", "ml.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg2://gridiron:gridiron@db:5432/gridiron
      MODEL_DIR: ml/artifacts
      DEFAULT_MODEL_VERSION: logreg_v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/ml/artifacts

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  model_artifacts:
